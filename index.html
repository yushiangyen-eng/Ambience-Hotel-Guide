        image: 'https://images.unsplash.com/photo-1563245372-f21724e3856d?auto=format&fit=crop&w=800&q=80',
        map_url: 'https://www.google.com/maps/search/?api=1&query=長安東路一段熱炒',
        addr: '台北市中山區長安東路一段',
        zh: {
          name: '長安東路一段台式熱炒一條街',
          area: '飯店周邊 / 長安東路',
          short_desc: '就在飯店步行 7 分鐘距離！體驗最道地的台灣夜晚熱炒文化與冰涼生啤酒。',
          hours: '17:00 – 01:00',
          pay: 'NT$350–600 / 人 · 現金為主',
          must: '三杯雞、鳳梨蝦球、炒水蓮、18天台灣生啤酒',
          desc: '長安東路一段是台北著名的熱炒聚落，鑊氣十足的現炒料理搭配熱情喧鬧的用餐氛圍，是體驗在地夜生活的首選。',
          tip: '熱門時段（19:00–21:00）建議提前請飯店櫃檯幫您電話訂位，以免現場久候。'
        },
        en: {
          name: 'Changan East Rd. Taiwanese Stir-Fry (Rechao) Alley',
          area: 'Hotel Neighborhood',
          short_desc: 'Just 7 mins away! Experience authentic late-night Taiwanese wok dishes and ice-cold draft beer.',
          hours: '17:00 – 01:00',
          pay: 'NT$350–600 / person · Cash',
          must: 'Three-Cup Chicken, Pineapple Shrimp, 18-Day Taiwan Draft Beer',
          desc: 'Lively open-front local taverns serving dozens of freshly wok-fried dishes at great value.',
          tip: 'Ask our front desk to call ahead for a table during peak dinner hours (7–9 PM).'
        },
        ja: {
          name: '長安東路一段 台湾式居酒屋「熱炒（ルーチャオ）」通り',
          area: 'ホテル周辺',
          short_desc: 'ホテルから徒歩7分！活気あふれるローカル居酒屋で本場の台湾料理と生ビールを堪能。',
          hours: '17:00 – 01:00',
          pay: 'NT$350–600 / 人 · 現金のみ',
          must: '三杯鶏（サンペイジー）、パイナップルエビマヨ、賞味期限18日台湾生ビール',
          desc: '強火で一気に仕上げる絶品中華おつまみと、賑やかなローカルの雰囲気を味わえるスポットです。',
          tip: '19時〜21時のピーク時は混み合いますので、フロントにて事前予約を承ります。'
        }
      }
    ];

    // 初始化渲染
    function renderAll() {
      const t = i18n[currentLang];

      // 更新靜態 UI 文字
      document.getElementById('ui-subtitle').textContent = t.subtitle;
      document.getElementById('ui-walk15').textContent = t.walk15;
      document.getElementById('ui-origin').textContent = t.origin;
      document.getElementById('ui-footer-title').textContent = t.footerTitle;
      document.getElementById('ui-footer-sub').textContent = t.footerSub;
      document.getElementById('ui-label-hours').textContent = t.labelHours;
      document.getElementById('ui-label-pay').textContent = t.labelPay;
      document.getElementById('ui-label-must').textContent = t.labelMust;
      document.getElementById('ui-label-addr').textContent = t.labelAddr;
      document.getElementById('ui-label-tip').textContent = t.labelTip;
      document.getElementById('ui-btn-nav').textContent = t.btnNav;

      // 更新語系按鈕樣式
      ['zh', 'en', 'ja'].forEach(lang => {
        const btn = document.getElementById(`lang-${lang}`);
        if (lang === currentLang) {
          btn.className = 'px-2.5 py-1 rounded-full bg-white text-zinc-900 shadow-xs font-bold transition';
        } else {
          btn.className = 'px-2.5 py-1 rounded-full text-zinc-500 hover:text-zinc-900 transition';
        }
      });

      // 更新步行15分按鈕樣式
      const walkBtn = document.getElementById('btn-walk15');
      walkBtn.className = onlyWalk15
        ? 'shrink-0 flex items-center gap-1 px-3 py-1.5 rounded-full text-xs font-semibold bg-amber-500 text-white border border-amber-500 transition'
        : 'shrink-0 flex items-center gap-1 px-3 py-1.5 rounded-full text-xs font-medium border border-zinc-200 text-zinc-700 bg-white transition';

      // 渲染分類膠囊列
      const catContainer = document.getElementById('category-list');
      catContainer.innerHTML = Object.entries(t.cats).map(([key, label]) => {
        const active = currentCat === key;
        const cls = active
          ? 'shrink-0 px-3.5 py-1.5 rounded-full text-xs font-semibold bg-zinc-900 text-white transition'
          : 'shrink-0 px-3.5 py-1.5 rounded-full text-xs font-medium bg-zinc-100 text-zinc-600 hover:bg-zinc-200 transition';
        return `<button onclick="setCat('${key}')" class="${cls}">${label}</button>`;
      }).join('');

      // 過濾資料
      const filtered = spotsData.filter(spot => {
        const matchCat = currentCat === 'all' || spot.category === currentCat;
        const matchWalk = !onlyWalk15 || spot.walk_time <= 15;
        return matchCat && matchWalk;
      });

      document.getElementById('ui-count').textContent = t.count(filtered.length);

      // 渲染卡片列表
      const cardsContainer = document.getElementById('cards-container');
      cardsContainer.innerHTML = filtered.map(spot => {
        const info = spot[currentLang];
        return `
          <article onclick="openModal('${spot.id}')" class="group bg-white rounded-2xl border border-zinc-100 shadow-xs overflow-hidden cursor-pointer active:scale-[0.99] transition">
            <!-- 圖片區 -->
            <div class="relative aspect-[16/10] bg-zinc-100 overflow-hidden">
              <img src="${spot.image}" alt="${info.name}" loading="lazy" class="w-full h-full object-cover group-hover:scale-105 transition duration-500" />
              
              ${spot.is_featured ? `
                <div class="absolute top-3 left-3 bg-zinc-900/85 backdrop-blur-xs text-white text-[11px] font-medium px-2.5 py-1 rounded-full">
                  ${t.featured}
                </div>
              ` : ''}

              <div class="absolute bottom-3 right-3 bg-white/95 backdrop-blur-xs text-zinc-900 text-xs font-semibold px-2.5 py-1 rounded-full shadow-xs">
                ${t.walkMin(spot.walk_time)}
              </div>
            </div>

            <!-- 文字資訊區 -->
            <div class="p-4">
              <div class="flex items-start justify-between gap-2">
                <h2 class="text-base font-bold text-zinc-900 leading-snug line-clamp-2">${info.name}</h2>
                <span class="shrink-0 text-[11px] font-medium bg-zinc-100 text-zinc-600 px-2 py-0.5 rounded-md mt-0.5">
                  ${info.area}
                </span>
              </div>
              <p class="text-xs text-zinc-500 mt-1.5 line-clamp-2 leading-relaxed">
                ${info.short_desc}
              </p>

              <!-- 卡片底部快速操作列 -->
              <div class="mt-3 pt-2.5 border-t border-zinc-50 flex items-center justify-between text-xs">
                <span class="text-zinc-400 truncate max-w-[65%]">${info.must}</span>
                <a href="${spot.map_url}" target="_blank" onclick="event.stopPropagation()" class="font-semibold text-zinc-900 hover:text-amber-600 flex items-center gap-0.5">
                  ${t.navShort}
                </a>
              </div>
            </div>
          </article>
        `;
      }).join('');
    }

    // 互動控制函式
    function setLang(lang) {
      currentLang = lang;
      renderAll();
      if (currentSpot) populateModal(currentSpot);
    }

    function setCat(cat) {
      currentCat = cat;
      renderAll();
    }

    function toggleWalk15() {
      onlyWalk15 = !onlyWalk15;
      renderAll();
    }

    function resetFilters() {
      currentCat = 'all';
      onlyWalk15 = false;
      renderAll();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // Modal 開啟與關閉
    function openModal(id) {
      const spot = spotsData.find(s => s.id === id);
      if (!spot) return;
      currentSpot = spot;
      populateModal(spot);

      const modal = document.getElementById('spot-modal');
      const backdrop = document.getElementById('modal-backdrop');
      const sheet = document.getElementById('modal-sheet');

      modal.classList.remove('hidden');
      document.body.style.overflow = 'hidden'; // 鎖定背景滾動

      requestAnimationFrame(() => {
        backdrop.classList.remove('opacity-0');
        sheet.classList.remove('translate-y-full');
      });
    }

    function populateModal(spot) {
      const t = i18n[currentLang];
      const info = spot[currentLang];

      document.getElementById('m-img').src = spot.image;
      document.getElementById('m-badge').textContent = t.featured;
      document.getElementById('m-badge').classList.toggle('hidden', !spot.is_featured);
      document.getElementById('m-area').textContent = info.area;
      document.getElementById('m-walk').textContent = t.walkDetail(spot.walk_time);
      document.getElementById('m-title').textContent = info.name;
      document.getElementById('m-hours').textContent = info.hours;
      document.getElementById('m-pay').textContent = info.pay;
      document.getElementById('m-must').textContent = info.must;
      document.getElementById('m-addr').textContent = spot.addr;
      document.getElementById('m-desc').textContent = info.desc;
      document.getElementById('m-tip').textContent = info.tip;
      document.getElementById('m-map-btn').href = spot.map_url;
      document.getElementById('btn-copy').textContent = t.copyBtn;
    }

    function closeModal() {
      const modal = document.getElementById('spot-modal');
      const backdrop = document.getElementById('modal-backdrop');
      const sheet = document.getElementById('modal-sheet');

      backdrop.classList.add('opacity-0');
      sheet.classList.add('translate-y-full');

      setTimeout(() => {
        modal.classList.add('hidden');
        document.body.style.overflow = '';
        currentSpot = null;
      }, 280);
    }

    function copyAddress() {
      if (!currentSpot) return;
      navigator.clipboard.writeText(currentSpot.addr);
      const btn = document.getElementById('btn-copy');
      btn.textContent = i18n[currentLang].copiedBtn;
      setTimeout(() => {
        btn.textContent = i18n[currentLang].copyBtn;
      }, 1500);
    }

    // 啟動頁面
    renderAll();
  </script>
</body>
</html>
